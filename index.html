<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buon Compleanno ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Sfondo con gradient */
        #background {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(232, 137, 28, 1) 0%, rgba(64, 22, 4, 1) 100%);
            z-index: -1;
        }
        
        body {
            overflow: hidden;
            font-family: "Georgia", serif;
            color: #f5f0e6;
        }
        
        /* SLIDESHOW CONTAINER: gestisce il fade e nasconde l'overflow dello zoom */
        .slideshow {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            /* Rimosso background-size e background-position */
            /* AGGIUNTO filter alla transizione per l'effetto blur */
            transition: opacity 2s ease-in-out, filter 2s ease-in-out; 
            filter: brightness(0.85);
            overflow: hidden; /* **CRUCIALE per l'effetto Ken Burns** */
        }

        /* CLASSE AGGIUNTA: Attiva BLUR e scurisce durante il fade-out */
        .slideshow.transitioning {
            filter: brightness(0.7) blur(10px); 
        }

        /* EFFETTO ZOOM-OUT AGGIUNTO al Ken Burns Layer */
        .slideshow.transitioning #kenburns-layer {
            transform: scale(0.98); /* Zoom out leggero */
            transition: transform 2s ease-in-out; /* Applica transizione LENTA al transform */
        }
        
        /* KEN BURNS LAYER: gestisce l'immagine e l'animazione */
        #kenburns-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            /* Inizialmente non trasformato */
            transform: scale(1);
            transition: transform 0s; /* Assicura un reset istantaneo della trasformazione */
        }
        
        /* Keyframes per l'Effetto Ken Burns (Zoom/Pan) */
        @keyframes kb-zoom-in {
            0% { transform: scale(1.0); transform-origin: 50% 50%; }
            100% { transform: scale(1.15); transform-origin: 50% 50%; }
        }
        
        @keyframes kb-pan-up-right {
            0% { transform: scale(1.15) translate(0, 0); transform-origin: 50% 50%; }
            100% { transform: scale(1.25) translate(3%, -3%); transform-origin: 50% 50%; }
        }
        
        @keyframes kb-zoom-out-down-left {
            0% { transform: scale(1.2) translate(3%, -3%); transform-origin: 50% 50%; }
            100% { transform: scale(1.05) translate(-3%, 3%); transform-origin: 50% 50%; }
        }
        
        /* 4. Panoramica Lenta da Sinistra a Destra */
        @keyframes kb-pan-left-right {
            0% { 
                transform: scale(1.15) translate(5%, 0); 
                transform-origin: 50% 50%; /* Parte zoomando leggermente e posizionato a sinistra */
            }
            100% { 
                transform: scale(1.15) translate(-5%, 0); 
                transform-origin: 50% 50%; /* Arriva a destra mantenendo lo stesso zoom */
            }
        }
        
        /* 5. Zoom In focalizzato sull'Angolo Basso Destro */
        @keyframes kb-zoom-in-bottom-right {
            0% { 
                transform: scale(1.0); 
                transform-origin: 100% 100%; /* Inizia senza zoom, focalizzato in basso a destra */
            }
            100% { 
                transform: scale(1.2); 
                transform-origin: 100% 100%; /* Zooma verso il punto focale in basso a destra */
            }
        }
        
        /* 6. Zoom Out con Leggera Rotazione */
        @keyframes kb-zoom-out-rotate {
            0% { 
                transform: scale(1.25) rotate(1deg); 
                transform-origin: 50% 50%; /* Inizia zoomato e leggermente ruotato in senso orario */
            }
            100% { 
                transform: scale(1.05) rotate(-2deg); 
                transform-origin: 50% 50%; /* Zooma indietro e ruota leggermente in senso antiorario */
            }
        }
        
        
        /* Classi per applicare le animazioni (Durata 10s - corrispondente a setInterval) */
        .kb-animation-1 { animation: kb-zoom-in 10s linear forwards; }
        .kb-animation-2 { animation: kb-pan-up-right 10s linear forwards; }
        .kb-animation-3 { animation: kb-zoom-out-down-left 10s linear forwards; }
        .kb-animation-4 { animation: kb-pan-left-right 10s linear forwards; }
        .kb-animation-5 { animation: kb-zoom-in-bottom-right 10s linear forwards; }
        .kb-animation-6 { animation: kb-zoom-out-rotate 10s linear forwards; }
        
        
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.35);
        }
        
        .text {
            position: absolute;
            bottom: 18%;
            width: 100%;
            text-align: center;
            font-size: 1.6rem;
            line-height: 1.7;
            padding: 0 12%;
            color: #f5f0e6;
            text-shadow: 0 0 10px rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        
        .accent {
            color: #e8a13a;
        }
        
        audio { display: none; }
        
        #startScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #2a1508 0%, #140a04 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
            transition: opacity 1s ease-in-out;
        }
        
        #startButton {
            border: 2px solid #e8a13a;
            color: #e8a13a;
            padding: 0.8em 1.6em;
            background: transparent;
            border-radius: 50px;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        
        #startButton:hover {
            background: #e8a13a;
            color: #1a0d04;
        }
        
        
        @media (max-width: 768px) {
            .text { font-size: 1.8rem; padding: 0 8%; }
            #startButton { font-size: 1rem; padding: 0.7em 1.4em; }
        }
        
        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: #fff;
            opacity: 0.8;
            pointer-events: none;
            animation-name: float;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
            /* Direzione di rotazione (impostata dal JS: 1 o -1) */
            --spin: 1;
            /* Forma a FOGLIA applicata come maschera (scala con la dimensione dell'elemento) */
            -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 2 C78 28 96 40 50 98 C4 40 22 28 50 2 Z'/></svg>");
            mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 2 C78 28 96 40 50 98 C4 40 22 28 50 2 Z'/></svg>");
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }
        
        
        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(calc(0deg * var(--spin))) scale(1);
                opacity: 1;
            }
            25% {
                transform: translate(3vw, -25vh) rotate(calc(90deg * var(--spin))) scale(0.95);
                opacity: 0.95;
            }
            50% {
                transform: translate(-2.5vw, -50vh) rotate(calc(180deg * var(--spin))) scale(0.9);
                opacity: 0.8;
            }
            75% {
                transform: translate(2vw, -75vh) rotate(calc(270deg * var(--spin))) scale(0.75);
                opacity: 0.4;
            }
            100% {
                transform: translate(0, -100vh) rotate(calc(360deg * var(--spin))) scale(0.5);
                opacity: 0;
            }
        }
        
        /* ===== CUORICINI INTERATTIVI ===== */
        #hearts {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 2;
        }
        
        .heart {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            animation-name: floatHeart;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
            --sway: 1;
            background: #e23b4a;
            -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C50 88 12 60 12 33 C12 17 25 7 39 7 C46 7 50 12 50 12 C50 12 54 7 61 7 C75 7 88 17 88 33 C88 60 50 88 50 88 Z'/></svg>");
            mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C50 88 12 60 12 33 C12 17 25 7 39 7 C46 7 50 12 50 12 C50 12 54 7 61 7 C75 7 88 17 88 33 C88 60 50 88 50 88 Z'/></svg>");
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            filter: drop-shadow(0 0 10px rgba(226,59,74,0.65));
        }
        
        .heart-fragment {
            position: absolute;
            pointer-events: none;
            background: #ff5d73;
            -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C50 88 12 60 12 33 C12 17 25 7 39 7 C46 7 50 12 50 12 C50 12 54 7 61 7 C75 7 88 17 88 33 C88 60 50 88 50 88 Z'/></svg>");
            mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C50 88 12 60 12 33 C12 17 25 7 39 7 C46 7 50 12 50 12 C50 12 54 7 61 7 C75 7 88 17 88 33 C88 60 50 88 50 88 Z'/></svg>");
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            animation: heartPop 1.1s ease-out forwards;
        }
        
        @keyframes floatHeart {
            0% {
                transform: translate(0, 0) rotate(calc(-8deg * var(--sway))) scale(0.6);
                opacity: 0;
            }
            12% {
                opacity: 1;
                transform: translate(1.5vw, -12vh) rotate(calc(8deg * var(--sway))) scale(1);
            }
            50% {
                transform: translate(calc(-3vw * var(--sway)), -50vh) rotate(calc(-8deg * var(--sway))) scale(1.03);
                opacity: 1;
            }
            88% {
                opacity: 1;
            }
            100% {
                transform: translate(2vw, -100vh) rotate(calc(8deg * var(--sway))) scale(0.95);
                opacity: 0;
            }
        }
        
        @keyframes heartPop {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.2);
                opacity: 0;
            }
        }
        
        #endFade {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: black;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            transition: opacity 4s ease-in-out;
        }
        
        
        
    </style>
</head>
<body>
    
    <div id="background"></div>
    <div id="particles"></div>
    <div id="hearts"></div>
    <div id="endFade"></div>
    
    
    <audio id="music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>
    
    <div id="startScreen">
        <h1 style="color:#f5e9d4; font-weight:400; margin-bottom:0.5em;">Tocca per iniziare 🎵</h1>
        <p style="color:#ff8796; font-size:0.95rem; margin-bottom:1.5em;">💕 Tocca i cuoricini per una sorpresa! 💕</p>
        <button id="startButton">Inizia</button>
    </div>
    
    <div id="slides" class="slideshow">
        <div id="kenburns-layer"></div>
    </div>
    <div class="overlay"></div>
    <div id="text" class="text"></div>
    

<script>
    const images = [
    "foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg","foto5.jpg",
    "foto6.jpg","foto7.jpg","foto8.jpg","foto9.jpg","foto10.jpg"
    ];
    
    const texts = [
    "Dicono che la memoria giochi brutti scherzi...",
    "E ammettiamolo: tu dimentichi il telecomando, il telefono, le parole e perché sei entrata in una stanza",
    "Ma in fondo la colpa è mia: perché io mi dimentico troppo spesso di dirti quanto sei fantastica",
    "Poi guardo la vita che abbiamo costruito insieme, giorno dopo giorno...",
    "...e questo bellissimo \"caos\" a quattro in cui due terremoti ti chiamano \"mamma\"",
    "Nessuno sa come fai a gestire tutto anche quando la pazienza è quasi a zero",
    "Sei il punto di riferimento e il cuore della famiglia",
    "Grazie per ogni singolo abbraccio, ogni parola e ogni gesto",
    "Oggi rilassati, prenditi il tuo tempo e goditi la tua festa: a ricordarsi di tutto il resto ci pensiamo noi!",
    "Buon compleanno amore mio! <br><span class='accent'>Ti amo ❤️</span>"
    ];
    
    const slideEl = document.getElementById("slides");
    const kenBurnsLayer = document.getElementById("kenburns-layer"); // Layer Ken Burns
    const textEl = document.getElementById("text");
    const music = document.getElementById("music");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    
    // Array delle classi di Ken Burns disponibili
    const kenBurnsClasses = ["kb-animation-1", "kb-animation-2", "kb-animation-3", "kb-animation-4", "kb-animation-5", "kb-animation-6"]; 
    
    let index = 0; // Indice immagine
    let textIndex = 0; // Indice testo
    let started = false;
    
    let slideCount = 0;
    const totalSlides = images.length;
    // Calcola quante immagini ci sono per ogni frase di testo
    const slidesPerText = Math.floor(images.length / texts.length);
    
    
    // ==========================================================
    // CONFIGURAZIONE PARTICELLE CORRETTA
    // ==========================================================
    
    let isBoosted = false; // Stato attuale del boost
    const boostDuration = 1500; // Durata del boost in ms (1.5 secondi)
    
    // ==========================================================
    // CONFIGURAZIONE (adatta questi valori alla TUA canzone)
    // ==========================================================
    // Secondo della traccia da cui far partire la musica (0 = dall'inizio).
    // Se la tua canzone ha un'intro da saltare, imposta qui il secondo di inizio.
    const musicStartTime = 0;

    // Durata di ogni slide in millisecondi (10000 = 10 secondi).
    const slideDuration = 10000;

    // Boost casuali delle foglie: intervallo (in ms) tra uno "scoppio" e l'altro.
    // Il ritardo effettivo è un valore CASUALE tra boostGapMin e boostGapMax.
    const boostGapMin = 9000;   // almeno 9 secondi
    const boostGapMax = 18000;  // al massimo 18 secondi
    // ==========================================================
    
    
    function showSlide() {
        
        // 1. RESET: Rimuovi le classi di animazione e forza il reset della trasformazione
        kenBurnsLayer.classList.remove(...kenBurnsClasses);
        kenBurnsLayer.style.transform = 'scale(1)'; 
        void kenBurnsLayer.offsetWidth; 
        
        // 2. Imposta la nuova immagine
        kenBurnsLayer.style.backgroundImage = `url(${images[index]})`;
        
        // 3. Applica un'animazione Ken Burns casuale
        const randomClass = kenBurnsClasses[Math.floor(Math.random() * kenBurnsClasses.length)];
        kenBurnsLayer.classList.add(randomClass);
        
        // 4. Fade-in dello slideshow (la transizione CSS gestisce i 2s)
        slideEl.style.opacity = 1;
    }
    
    function showText() {
        if (textIndex < texts.length) {
            // Aggiorna il contenuto del testo
            textEl.innerHTML = texts[textIndex];
            
            // Fade-in del nuovo testo (la transizione CSS gestisce i 2s)
            textEl.style.opacity = 1; 
        }
    }
    
    
    function nextSlide() {
        // 1. FADE-OUT: Inizia la dissolvenza incrociata per SLIDE e TESTO
        slideEl.classList.add('transitioning'); 
        slideEl.style.opacity = 0; 
        textEl.style.opacity = 0;
        
        // 2. Aspetta il completamento del fade-out (2 secondi)
        setTimeout(() => {
            
            // 3. Incrementa gli indici
            slideCount++;
            index = (index + 1) % images.length;
            
            // 4. Logica di avanzamento del testo
            if (slideCount % slidesPerText === 0 && textIndex < texts.length - 1) {
                textIndex++;
            }
            
            // 5. Carica la nuova slide e la nuova animazione
            showSlide(); 
            // 6. Aggiorna e mostra il nuovo testo
            showText();  
            
            // 7. Rimuove la classe dopo che la nuova slide è stata caricata
            slideEl.classList.remove('transitioning'); 
            
            // 8. Controllo di fine
            if (slideCount === totalSlides) {
                clearInterval(slideInterval); // ferma il ciclo
                fadeOutMusic();
                document.getElementById("endFade").style.opacity = 1;
                // Rimuovi i cuoricini rimasti
                document.getElementById("hearts").innerHTML = "";
            }
        }, 2000); // 2000ms (2s) è il tempo di transizione opacità
    }
    
    let slideInterval;


    function goFullscreen() {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (!req) return; // Fullscreen non supportato (es. iOS): si prosegue normalmente
        try {
            const result = req.call(el, { navigationUI: "hide" });
            if (result && typeof result.catch === "function") result.catch(() => {});
        } catch (e) { /* ignora eventuali rifiuti del browser */ }
    }
    
    function startPresentation() {
        if (started) return;
        started = true;
        
        // Tutto schermo (deve essere chiamato durante il gesto del click)
        goFullscreen();
        
        music.currentTime = musicStartTime; 
        music.play().catch(()=>{});
        startScreen.style.opacity = 0;
        setTimeout(() => startScreen.style.display = "none", 1000);
        
        // La prima volta, carichiamo subito la slide 0 e il testo 0
        showSlide();
        showText();
        
        // Avviamo il ciclo dopo il primo intervallo completo
        slideInterval = setInterval(nextSlide, slideDuration);
        
        // AVVIA LA GENERAZIONE DELLE PARTICELLE E LA SINCRONIZZAZIONE
        startParticleGeneration(); 
        scheduleBoosts();
        scheduleNextHeart(); // avvia i cuoricini casuali
    }
    
    
    startButton.addEventListener("click", startPresentation);
    
    // ==========================================================
    // FUNZIONI PARTICELLE E BOOST CORRETTE
    // ==========================================================
    
    function createParticle(boosted = false) {
        const particle = document.createElement("div");
        particle.classList.add("particle");
        
        // Direzione di rotazione casuale: le foglie avvolgono in entrambi i versi
        particle.style.setProperty("--spin", Math.random() < 0.5 ? 1 : -1);
        
        // Dimensione: 6-26px normale, 18-60px durante il boost
        const minSize = boosted ? 18 : 6;
        const maxSize = boosted ? 60 : 26;
        const size = minSize + Math.random() * (maxSize - minSize);
        particle.style.width = size + "px";
        particle.style.height = size + "px";
        
        // Posizione casuale
        particle.style.left = Math.random() * window.innerWidth + "px";
        particle.style.top = window.innerHeight + "px";
        
        // Colore casuale
        const colors = ["#f0b64c", "#e08a3c", "#c9502a", "#8c3a1a", "#a8551e", "#e6c04d"];
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        // Durata: 2-6 secondi normale, 1-3 secondi potenziata (per maggiore velocità)
        const minDuration = boosted ? 1 : 2;
        const maxDuration = boosted ? 2 : 6;
        const duration = minDuration + Math.random() * (maxDuration - minDuration);
        particle.style.animationDuration = duration + "s";
        
        // Applica un ritardo di animazione per maggiore casualità (opzionale)
        particle.style.animationDelay = (Math.random() * 0.5) + "s";
        
        document.getElementById("particles").appendChild(particle);
        
        // Rimuovi dopo l’animazione
        setTimeout(() => particle.remove(), duration * 1000);
    }
    
    
    // Funzione per attivare e disattivare l'effetto boost
    function setBoost(state) {
        isBoosted = state;
    }
    
    // Boost CASUALI: ogni po' (intervallo casuale tra boostGapMin e boostGapMax)
    // si attiva per boostDuration uno "scoppio" di foglie, fino a fine carosello.
    function scheduleBoosts() {
        const gap = boostGapMin + Math.random() * (boostGapMax - boostGapMin);
        setTimeout(() => {
            // Ferma i boost quando il carosello è terminato
            if (!started || slideCount >= totalSlides) return;
            setBoost(true);
            setTimeout(() => setBoost(false), boostDuration);
            scheduleBoosts(); // pianifica il successivo boost casuale
        }, gap);
    }
    
    // Avvia la generazione continua delle particelle, ORA MODIFICATA
    function startParticleGeneration() {
         setInterval(() => {
            if (started) {
                let particleCount = 0; 
                
                if (isBoosted) {
                    // Genera da 3 a 6 particelle durante il boost
                    particleCount = 3 + Math.floor(Math.random() * 4); 
                } else {
                    // Modalità normale: 1 particella (con una probabilità del 90%)
                    if (Math.random() < 0.9) { 
                        particleCount = 1;
                    }
                }
                
                // Chiama la funzione createParticle in base al conteggio
                for (let i = 0; i < particleCount; i++) {
                    createParticle(isBoosted);
                    console.log("Tempo musica:", music.currentTime.toFixed(2), "Boosted:", isBoosted);
                }
            }
        }, 300); 
    }
    
    // ===== CUORICINI INTERATTIVI (tocca per scoppiare!) =====
    let heartTimer = null;
    
    function scheduleNextHeart() {
        const gap = 6000 + Math.random() * 6000; // 6-12 secondi tra un cuore e l'altro
        heartTimer = setTimeout(spawnHeart, gap);
    }
    
    function spawnHeart() {
        // Ferma i cuoricini quando il carosello è terminato
        if (!started || slideCount >= totalSlides) return;
        
        const heart = document.createElement("div");
        heart.classList.add("heart");
        
        // Dimensione grande e visibile: 60-120px
        const size = 60 + Math.random() * 60;
        heart.style.width = size + "px";
        heart.style.height = size + "px";
        
        // Posizione casuale (partono sotto lo schermo)
        heart.style.left = (Math.random() * Math.max(1, window.innerWidth - size)) + "px";
        heart.style.top = window.innerHeight + "px";
        
        // Durata del volo (risale lenta e ben visibile)
        const duration = 12 + Math.random() * 6; // 12-18 secondi
        heart.style.animationDuration = duration + "s";
        
        // Oscillazione casuale (pendolo a destra o a sinistra)
        heart.style.setProperty("--sway", Math.random() < 0.5 ? 1 : -1);
        
        // Tocca/clicca → scoppia
        heart.addEventListener("click", (e) => {
            e.stopPropagation();
            popHeart(heart);
        });
        
        document.getElementById("hearts").appendChild(heart);
        
        // Se non toccato, sparisce a fine volo
        setTimeout(() => { if (heart.parentNode) heart.remove(); }, duration * 1000);
        
        // Pianifica il prossimo cuoricino
        scheduleNextHeart();
    }
    
    function popHeart(heart) {
        const rect = heart.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const baseSize = rect.width;
        
        heart.remove(); // il cuore scoppia
        
        // Effetto a frammenti: piccoli cuori che volano in direzioni casuali
        for (let i = 0; i < 10; i++) {
            createHeartFragment(cx, cy, baseSize);
        }
        
        // Suono della sorpresa
        playAuguri();
    }
    
    function createHeartFragment(cx, cy, baseSize) {
        const frag = document.createElement("div");
        frag.classList.add("heart-fragment");
        
        const s = baseSize * (0.18 + Math.random() * 0.25);
        frag.style.width = s + "px";
        frag.style.height = s + "px";
        frag.style.left = (cx - s / 2) + "px";
        frag.style.top = (cy - s / 2) + "px";
        
        // Direzione e distanza casuali dell'esplosione
        const angle = Math.random() * Math.PI * 2;
        const dist = 70 + Math.random() * 130;
        frag.style.setProperty("--tx", (Math.cos(angle) * dist) + "px");
        frag.style.setProperty("--ty", (Math.sin(angle) * dist - 50) + "px"); // verso l'alto
        
        document.getElementById("hearts").appendChild(frag);
        setTimeout(() => { if (frag.parentNode) frag.remove(); }, 1200);
    }
    
    // ===== SUONI DEGLI AUGURI: shuffle senza ripetizioni dalla cartella auguri/ =====
    let AUGURI_FILES = [];   // elenco dei file mp3 (caricato all'avvio)
    let auguriQueue = [];    // coda shuffled, si rigenera quando finisce
    let lastPlayed = null;   // ultimo file suonato (evita ripetizioni immediate)
    const auguriCache = {};  // file -> oggetto Audio precaricato

    // Elenco di riserva (usato solo se non ci sono né directory listing né list.json)
    const AUGURI_INLINE = ["selene.mp3","cinzia.mp3","mario.mp3","marzia.mp3","paoloemarzia.mp3","maurizioedalila.mp3"];

    // Fisher-Yates shuffle (mescola in-place e ritorna l'array)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }

    // Carica l'elenco dei file: prima auguri/list.json (fonte primaria), poi directory listing, infine inline
    async function loadAuguriList() {
        // 1) Manifest auguri/list.json (fonte primaria: su GitHub Pages e Live Preview non c'è directory listing)
        try {
            const r = await fetch("auguri/list.json");
            if (r.ok) {
                const data = await r.json();
                if (Array.isArray(data) && data.length) {
                    return data.filter(f => typeof f === "string" && f).map(f => f.split("/").pop());
                }
            }
        } catch (e) { /* prosegue con la prossima sorgente */ }

        // 2) Directory listing (solo se list.json assente/vuoto; server tipo python -m http.server)
        try {
            const r = await fetch("auguri/");
            if (r.ok) {
                const html = await r.text();
                const found = [...html.matchAll(/href="([^"?]+\.mp3)"/gi)]
                    .map(m => decodeURIComponent(m[1]).split("/").pop());
                const files = [...new Set(found)];
                if (files.length) return files;
            }
        } catch (e) { /* prosegue con la prossima sorgente */ }

        // 3) Fallback inline
        return AUGURI_INLINE;
    }

    // Prossimo file: coda shuffled; quando finisce, rimescola (senza ripetizioni nella sequenza)
    function nextAuguriFile() {
        if (auguriQueue.length === 0) {
            auguriQueue = shuffleArray(AUGURI_FILES.slice());
            // Evita che il primo suonato della nuova sequenza sia uguale all'ultimo appena suonato
            if (auguriQueue.length > 1 && auguriQueue[auguriQueue.length - 1] === lastPlayed) {
                const last = auguriQueue[auguriQueue.length - 1];
                auguriQueue[auguriQueue.length - 1] = auguriQueue[0];
                auguriQueue[0] = last;
            }
        }
        const file = auguriQueue.pop();
        lastPlayed = file;
        return file;
    }

    // Precarica tutti gli audio (per riproduzione immediata allo scoppio)
    function preloadAuguri() {
        AUGURI_FILES.forEach(f => {
            const path = "auguri/" + f;
            if (!auguriCache[path]) auguriCache[path] = new Audio(path);
        });
    }

    function playAuguri() {
        if (!AUGURI_FILES.length) return;
        const file = nextAuguriFile();
        if (!file) return;
        const path = "auguri/" + file;
        let a = auguriCache[path];
        if (!a) { a = new Audio(path); auguriCache[path] = a; }
        try { a.currentTime = 0; } catch (e) {}

        // --- DUCKING: abbassa la musica di sottofondo per sentire meglio l'auguri ---
        activeAuguriCount++;
        duckMusic();

        // Rilascio del volume: al termine del messaggio la musica torna al volume normale.
        // activeAuguriCount garantisce che, se parte un altro auguri nel frattempo,
        // la musica resti abbassata finché non terminano TUTTI.
        let released = false;
        const release = () => {
            if (released) return;
            released = true;
            activeAuguriCount = Math.max(0, activeAuguriCount - 1);
            restoreMusic();
        };
        const onEnded = () => { cleanup(); release(); };
        const onError = () => { cleanup(); release(); };
        const cleanup = () => {
            a.removeEventListener("ended", onEnded);
            a.removeEventListener("error", onError);
        };
        a.addEventListener("ended", onEnded);
        a.addEventListener("error", onError);

        a.play().catch(() => { cleanup(); release(); }); // ignora errori (file mancante, autoplay bloccato, ecc.)
    }

    // Carica l'elenco all'avvio pagina e precarica gli audio
    loadAuguriList().then(files => {
        AUGURI_FILES = files;
        preloadAuguri();
        console.log("Auguri disponibili:", AUGURI_FILES);
    });
    
    // ==========================================================
    // DUCKING: abbassa la musica di sottofondo durante i messaggi di auguri
    // (quando si tocca un cuoricino parte l'audio di auguri dalla cartella auguri/)
    // ==========================================================
    const MUSIC_BASE_VOLUME = 1.0;   // volume "normale" della musica
    const DUCK_VOLUME = 0.18;        // volume ridotto durante il messaggio di auguri
    const DUCK_FADE_MS = 500;        // durata dell'abbassamento e del rialzo (ms)

    let volumeRampTimer = null;      // timer della rampa di volume in corso
    let activeAuguriCount = 0;       // quanti messaggi di auguri suonano contemporaneamente
    let musicFinished = false;       // true quando il carosello è finito (musica in fade-out)

    // Rampa lineare del volume della musica (unico punto che modifica music.volume)
    function rampMusicVolume(target, duration = DUCK_FADE_MS, onComplete = null) {
        if (volumeRampTimer) { clearInterval(volumeRampTimer); volumeRampTimer = null; }
        const from = music.volume;
        const steps = Math.max(1, Math.round(duration / 40));
        let i = 0;
        volumeRampTimer = setInterval(() => {
            i++;
            const k = i / steps;
            music.volume = from + (target - from) * k;
            if (i >= steps) {
                clearInterval(volumeRampTimer);
                volumeRampTimer = null;
                music.volume = target;
                if (onComplete) onComplete();
            }
        }, duration / steps);
    }

    // Abbassa la musica per far sentire meglio il messaggio di auguri
    function duckMusic() {
        rampMusicVolume(DUCK_VOLUME, DUCK_FADE_MS);
    }

    // Rialza la musica a volume normale (solo se non ci sono altri auguri in corso)
    function restoreMusic() {
        if (activeAuguriCount > 0) return;
        if (musicFinished) return;   // il carosello è finito: non rialzare la musica
        rampMusicVolume(MUSIC_BASE_VOLUME, DUCK_FADE_MS);
    }

    function fadeOutMusic(duration = 5000) {
        musicFinished = true;
        rampMusicVolume(0, duration, () => {
            music.pause();
            music.currentTime = 0; // opzionale: resetta la traccia
        });
    }
    
</script>
